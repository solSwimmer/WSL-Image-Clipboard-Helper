[package]
name = "wsl_clipboard"
version = "4.2.0"
edition = "2021"
description = "WSL CLI Clipboard Helper - Fast image paste for AI agents"
authors = ["liu"]
build = "build.rs"

[dependencies]
# Windows crate — enable the full feature set so imports resolve
[target.'cfg(windows)'.dependencies]
windows = { version = "=0.52", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_DataExchange",
    "Win32_System_Ole",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_UI_Shell_Common",
    "Win32_UI_Input_Pointer",
] }

# Global hotkeys
global-hotkey = "0.5"

# Async runtime
tokio = { version = "1.38", features = ["full"] }

# Config
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
dirs = "5.0"

# Error handling
anyhow = "1.0.103"
thiserror = "1.0"

# Image processing (optional)
image = { version = "0.24", optional = true }
png = "0.17"

# Time
chrono = "0.4"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# winresource only embeds resources on a Windows host (see build.rs);
# keep it in shared build-dependencies so cargo check works from non-Windows hosts
[build-dependencies]
winresource = "0.1"

[features]
default = ["image-support"]
image-support = ["dep:image"]

[profile.release]
lto = true
strip = true
codegen-units = 1
opt-level = 3

[profile.release.package."*"]
opt-level = 3
