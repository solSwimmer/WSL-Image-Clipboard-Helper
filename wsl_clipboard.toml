hotkey = "!v"
runtime_mode = "fast"
paste_format = "plain"
path_style = "plain"

# IME guard strategy (only applies when runtime_mode = "safe")
#   off          = never touch the IME
#   imm          = close the foreground window's IME input only (default; does not add a keyboard layout)
#   layout       = switch to an English keyboard layout, but only reuse one already installed
#   layout-force = load ENG only if no English layout is found, then unload it on exit
ime_protection = "imm"
