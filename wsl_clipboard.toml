hotkey = "!v"
runtime_mode = "fast"
paste_format = "plain"
path_style = "plain"

# IME guard policy (only effective when runtime_mode = "safe")
#   off          = never touches the IME
#   imm          = only closes the foreground window's IME open status (default; never adds a keyboard layout)
#   layout       = switch to an English layout, reusing only layouts already installed
#   layout-force = load ENG only when no English layout exists, unloaded automatically on exit
ime_protection = "imm"
