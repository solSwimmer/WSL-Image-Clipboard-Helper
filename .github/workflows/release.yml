# Publish a GitHub Release only from an explicit v* tag or a manual dispatch
# that names that tag. Branch pushes never create or overwrite a release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing or new tag to publish (e.g. v4.2.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --target x86_64-pc-windows-msvc

      - name: Build (release)
        working-directory: rust
        run: cargo build --release --target x86_64-pc-windows-msvc --locked

      - name: Package
        id: package
        shell: pwsh
        run: |
          $tag = '${{ inputs.tag }}'
          if (-not $tag -and '${{ github.ref_type }}' -eq 'tag') {
            $tag = '${{ github.ref_name }}'
          }
          if (-not $tag) { throw 'Refusing to package a release without an explicit tag' }
          if ($tag -notmatch '^v\d') { throw "Refusing non-version tag: $tag" }

          $dir = 'WSL-Image-Clipboard-Helper'
          New-Item -ItemType Directory -Path "$dir/temp" -Force | Out-Null
          Copy-Item rust/target/x86_64-pc-windows-msvc/release/wsl_clipboard.exe "$dir/"
          Copy-Item README.md "$dir/"
          Copy-Item LICENSE "$dir/" -ErrorAction SilentlyContinue
          Copy-Item SECURITY.md "$dir/" -ErrorAction SilentlyContinue
          @'
          hotkey = "!v"
          runtime_mode = "fast"
          paste_format = "plain"
          path_style = "plain"
          ime_protection = "imm"
          allow_non_image_files = false
          '@ | Set-Content -Encoding utf8 "$dir/wsl_clipboard.toml"
          New-Item -ItemType File -Path "$dir/temp/.keep" -Force | Out-Null

          $zip = "WSL-Image-Clipboard-Helper-$tag.zip"
          Compress-Archive -Path $dir -DestinationPath $zip -Force

          $zipHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          $exeHash = (Get-FileHash "$dir/wsl_clipboard.exe" -Algorithm SHA256).Hash.ToLower()
          "tag=$tag" | Add-Content $env:GITHUB_OUTPUT
          "zip=$zip" | Add-Content $env:GITHUB_OUTPUT
          "zip_sha256=$zipHash" | Add-Content $env:GITHUB_OUTPUT
          "exe_sha256=$exeHash" | Add-Content $env:GITHUB_OUTPUT

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: WSL-Image-Clipboard-Helper-${{ steps.package.outputs.tag }}
          path: ${{ steps.package.outputs.zip }}

      - name: Create GitHub Release
        if: github.ref_type == 'tag' || inputs.tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.package.outputs.tag }}
          ZIP: ${{ steps.package.outputs.zip }}
          ZIP_SHA256: ${{ steps.package.outputs.zip_sha256 }}
          EXE_SHA256: ${{ steps.package.outputs.exe_sha256 }}
        run: |
          gh release view $env:TAG 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $($env:TAG) already exists; refusing to clobber assets"
            exit 1
          }

          $title = $env:TAG
          $notesPath = ".github/release-notes/$($env:TAG).md"
          if (Test-Path $notesPath) {
            $lines = Get-Content $notesPath
            if ($lines.Count -gt 0 -and $lines[0] -like '# *') {
              $title = $lines[0].Substring(2).Trim()
              $lines = $lines | Select-Object -Skip 1
            }
            $notes = ($lines -join "`n").Trim()
          } else {
            $notes = "Automated release build for $($env:TAG)."
          }

          $checksums = @(
            ''
            '## Checksums'
            ''
            '```text'
            "SHA256  $($env:ZIP)"
            $env:ZIP_SHA256
            ''
            "SHA256  wsl_clipboard.exe"
            $env:EXE_SHA256
            '```'
            ''
            'Build this binary yourself with `cargo build --release` if you do not want to trust a prebuilt EXE.'
          ) -join "`n"
          $notes = $notes + "`n" + $checksums
          $notes | Set-Content -Encoding utf8 release-notes.md

          gh release create $env:TAG $env:ZIP --title $title --notes-file release-notes.md --target $env:GITHUB_SHA
